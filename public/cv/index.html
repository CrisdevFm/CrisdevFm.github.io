<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV - Cristian Forero</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0a0e27;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        width: min(760px, 90vw);
        background: #111827;
        border: 1px solid rgba(0, 212, 255, 0.25);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin-top: 0;
        color: #00d4ff;
      }
      p {
        line-height: 1.7;
        color: #d1d5db;
      }
      .box, .link-box {
        margin-top: 24px;
        padding: 18px;
        border: 1px dashed rgba(0, 212, 255, 0.4);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
      }
      .name {
        color: #00d4ff;
        font-weight: 700;
      }
      .link {
        display: inline-block;
        margin-top: 12px;
        background: #00d4ff;
        color: #0a0e27;
        text-decoration: none;
        font-weight: 700;
        padding: 12px 18px;
        border-radius: 10px;
      }
      a.pdf-link {
        display: inline-block;
        color: #00d4ff;
        text-decoration: none;
        font-weight: 700;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hoja de vida</h1>
      <p>
        Aquí están los archivos PDF de tu CV para descargar o abrir directamente.
      </p>

      <div class="box">
        <a class="pdf-link" href="/cv/CV_Cristian_Forero_Murillo.pdf" target="_blank" rel="noopener noreferrer">
          → CV Cristian Forero Murillo (Español)
        </a><br />
        <a class="pdf-link" href="/cv/CV_Cristian_Forero_Murillo_EN.pdf" target="_blank" rel="noopener noreferrer">
          → CV Cristian Forero Murillo (English)
        </a>
      </div>

      <div class="link-box">
        <a class="link" href="/">Volver al sitio</a>
      </div>
    </div>
  </body>
</html>
