<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV - Cristian Forero</title>
    <style>
      :root {
        --bg: #050505;
        --panel: #111111;
        --panel-soft: #151515;
        --gold: #d4af37;
        --gold-soft: #f5d77b;
        --text: #f7f3ea;
        --muted: #cfc8b7;
        --border: rgba(212, 175, 55, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, rgba(212, 175, 55, 0.12), transparent 35%), var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .card {
        width: min(820px, 100%);
        background: rgba(17, 17, 17, 0.96);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }

      .eyebrow {
        display: inline-block;
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(212, 175, 55, 0.08);
        color: var(--gold-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(2.2rem, 4vw, 3.4rem);
        color: var(--gold-soft);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .box,
      .link-box {
        margin-top: 28px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel-soft);
      }

      .pdf-list {
        display: grid;
        gap: 14px;
      }

      a.pdf-link,
      a.link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        min-height: 48px;
        padding: 12px 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: all 0.2s ease;
      }

      a.pdf-link {
        background: linear-gradient(135deg, var(--gold), var(--gold-soft));
        color: #111111;
        box-shadow: 0 10px 20px rgba(212, 175, 55, 0.18);
      }

      a.pdf-link:hover,
      a.link:hover {
        transform: translateY(-1px);
      }

      a.link {
        background: transparent;
        color: var(--gold-soft);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="eyebrow">CF</span>
      <h1>Hoja de vida</h1>
      <p>
        Aquí están los archivos PDF de mi CV para abrirlos o descargarlos directamente.
      </p>

      <div class="box">
        <div class="pdf-list">
          <a class="pdf-link" href="/cv/CV_Cristian_Forero_Murillo.pdf" target="_blank" rel="noopener noreferrer">
            CV Cristian Forero Murillo (Español)
          </a>
          <a class="pdf-link" href="/cv/CV_Cristian_Forero_Murillo_EN.pdf" target="_blank" rel="noopener noreferrer">
            CV Cristian Forero Murillo (English)
          </a>
        </div>
      </div>

      <div class="link-box">
        <a class="link" href="/">Volver al sitio</a>
      </div>
    </div>
  </body>
</html>
